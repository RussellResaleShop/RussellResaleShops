<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Russell Retail Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-visual">
      <a href="index.html" class="logo logo-light">Russell <span>Retail Shop</span></a>
      <div>
        <span class="eyebrow eyebrow-light">SELL WORLDWIDE</span>
        <h1>Manage your store from one powerful dashboard.</h1>
        <p>Track revenue, orders, products and sales performance.</p>
      </div>
      <small>Secure seller access</small>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-form-card">
        <div class="auth-heading">
          <span class="eyebrow">WELCOME BACK</span>
          <h2>Sign in</h2>
          <p>Enter any name and password to open the local dashboard.</p>
        </div>

        <form id="loginForm" class="auth-form">
          <label>
            Name
            <input type="text" id="loginName" placeholder="Your name" required />
          </label>
          <label>
            Password
            <div class="password-wrap">
              <input type="password" id="loginPassword" placeholder="Enter password" required />
              <button type="button" id="togglePassword">Show</button>
            </div>
          </label>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const nameInput = document.getElementById('loginName');
    const passwordInput = document.getElementById('loginPassword');
    const message = document.getElementById('loginMessage');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name || !passwordInput.value) return;

      localStorage.setItem('russellDashboardLoggedIn', 'true');
      localStorage.setItem('russellDashboardUser', JSON.stringify({ name }));

      message.textContent = 'Login successful. Opening dashboard...';
      message.className = 'form-message success';
      setTimeout(() => window.location.href = 'dashboard.html', 300);
    });
  </script>
</body>
</html>
