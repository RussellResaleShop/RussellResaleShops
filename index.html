<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Russell Retail Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-visual">
      <a href="index.html" class="logo logo-light">Russell <span>Retail Shop</span></a>
      <div>
        <span class="eyebrow eyebrow-light">SELL WORLDWIDE</span>
        <h1>Manage your store from one powerful dashboard.</h1>
        <p>Track revenue, orders, products and sales performance.</p>
      </div>
      <small>Secure seller access</small>
    </section>

    <section class="auth-form-wrap">
      <div class="auth-form-card">
        <div class="auth-heading">
          <span class="eyebrow">WELCOME BACK</span>
          <h2>Sign in</h2>
          <p>Sign in with your email and password, then enter your unique seller token.</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div id="credentialsStep">
          <label>
            Email
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <div class="password-wrap">
              <input type="password" id="loginPassword" placeholder="Enter password" required />
              <button type="button" id="togglePassword">Show</button>
            </div>
          </label>
          <button type="button" class="btn btn-primary btn-block" id="continueToToken">Continue</button>
          </div>
          <div id="tokenStep" hidden>
          <label>
            Unique seller token
            <input type="text" id="loginToken" placeholder="Contact admin for unique Token" autocomplete="one-time-code" />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          <button type="button" class="text-btn" id="backToCredentials">Back</button>
          </div>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="access-control.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passwordInput = document.getElementById('loginPassword');
    const tokenInput = document.getElementById('loginToken');
    const message = document.getElementById('loginMessage');
    const toggle = document.getElementById('togglePassword');
    const credentialsStep = document.getElementById('credentialsStep');
    const tokenStep = document.getElementById('tokenStep');

    toggle.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
    });

    document.getElementById('continueToToken').addEventListener('click', () => {
      if (!emailInput.value.trim() || !passwordInput.value) {
        form.reportValidity();
        return;
      }
      credentialsStep.hidden = true;
      tokenStep.hidden = false;
      tokenInput.required = true;
      tokenInput.focus();
      message.textContent = '';
    });

    document.getElementById('backToCredentials').addEventListener('click', () => {
      tokenStep.hidden = true;
      credentialsStep.hidden = false;
      tokenInput.required = false;
      message.textContent = '';
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const token = tokenInput.value.trim();

      if (!email || !password || !token) {
        message.textContent = 'Please enter your email, password, and token.';
        message.className = 'form-message';
        return;
      }

      const account = findSellerAccount(email, token);
      if (!account) {
        message.textContent = 'That email and token do not match an approved seller account.';
        message.className = 'form-message';
        return;
      }

      saveSellerSession(account);

      message.textContent = 'Login successful. Opening dashboard...';
      message.className = 'form-message success';
      setTimeout(() => window.location.href = 'dashboard.html', 300);
    });
  </script>
</body>
</html>
